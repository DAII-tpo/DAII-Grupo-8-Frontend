name: Frontend CI

on:
  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Ejecutar tests 
        run: npm run test
      
      - name: Generar cobertura
        run: npm run coverage

      - name: Compilar frontend
        run: npm run build
      
      - name: Analizar calidad con SonarQube
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true